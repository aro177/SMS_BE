services:
  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      - studentmanagementsystem
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app_network:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  studentmanagementsystem:
    image: student-management-system-api:latest
    build:
      context: .
      dockerfile: Student Management System/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ALLOWEDHOSTS: ${API_DOMAIN}
      CORS__ALLOWEDORIGINS: ${CORS_ALLOWED_ORIGINS}
      REVERSEPROXY__KNOWNPROXY: 172.30.0.2
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE__URL: ${SUPABASE_URL}
      AUTHENTICATION__VALIDISSUER: ${AUTHENTICATION_VALID_ISSUER}
      AUTHENTICATION__VALIDAUDIENCE: ${AUTHENTICATION_VALID_AUDIENCE:-authenticated}
    secrets:
      - db_connection
      - supabase_key
      - supabase_api_secret_key
    expose:
      - "8080"
    networks:
      app_network:
        ipv4_address: 172.30.0.3
    restart: unless-stopped

secrets:
  db_connection:
    file: ./secrets/db_connection.txt
  supabase_key:
    file: ./secrets/supabase_key.txt
  supabase_api_secret_key:
    file: ./secrets/supabase_api_secret_key.txt

volumes:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
