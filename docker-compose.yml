services:
  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      - frontend
      - studentmanagementsystem
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app_network:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  frontend:
    image: student-management-system-frontend:latest
    build:
      context: ${FRONTEND_BUILD_CONTEXT}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    environment:
      INTERNAL_API_URL: http://studentmanagementsystem:8080
      TZ: Asia/Ho_Chi_Minh
      NEXT_PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    expose:
      - "3000"
    networks:
      app_network:
        ipv4_address: 172.30.0.4
    restart: unless-stopped

  studentmanagementsystem:
    image: student-management-system-api:latest
    build:
      context: .
      dockerfile: Student Management System/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ALLOWEDHOSTS: "${PUBLIC_DOMAIN};studentmanagementsystem"
      CORS__ALLOWEDORIGINS: https://${PUBLIC_DOMAIN}
      REVERSEPROXY__KNOWNPROXY: 172.30.0.2
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE__URL: ${SUPABASE_URL}
      AUTHENTICATION__VALIDISSUER: ${AUTHENTICATION_VALID_ISSUER}
      AUTHENTICATION__VALIDAUDIENCE: ${AUTHENTICATION_VALID_AUDIENCE:-authenticated}
      TURNSTILE__EXPECTEDHOSTNAME: ${PUBLIC_DOMAIN}
    secrets:
      - db_connection
      - supabase_key
      - supabase_api_secret_key
      - turnstile_secret_key
    expose:
      - "8080"
    networks:
      app_network:
        ipv4_address: 172.30.0.3
    restart: unless-stopped

secrets:
  db_connection:
    file: ./secrets/db_connection.txt
  supabase_key:
    file: ./secrets/supabase_key.txt
  supabase_api_secret_key:
    file: ./secrets/supabase_api_secret_key.txt
  turnstile_secret_key:
    file: ./secrets/turnstile_secret_key.txt

volumes:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
